<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS ATS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="hero">
        <div class="badge">AI-POWERED RESUME ANALYZER</div>
        <h1>NEXUS <span>ATS</span></h1>
        <p>Upload your resume and get an ATS-focused analysis.</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form action="/analyze" method="POST" enctype="multipart/form-data" class="card">
        <label>Upload Resume</label>
        <input type="file" name="resume" accept=".pdf" required>

        <button type="submit">Analyze Resume →</button>
    </form>

    <p class="note">
        NEXUS ATS v1.0 provides an estimated ATS analysis.
        Different companies may use different ATS rules.
    </p>
</div>
</body>
</html>
